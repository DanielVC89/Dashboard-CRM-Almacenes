/* Gráfico de líneas del mes en curso */
const fShort=n=>{const a=Math.abs(n),s=n<0?'-':'';return a>=1e6?s+'$'+(a/1e6).toFixed(a%1e6?1:0).replace('.',',')+' M':a>=1e3?s+'$'+Math.round(a/1e3)+' mil':s+'$'+a};
function finChart(M){const R=[...M].sort((a,b)=>a.date.localeCompare(b.date));
if(R.length<2)return`<p class="hint" style="margin:8px 0 0">Registra al menos 2 días este mes y aquí verás cómo cambian tus ingresos, gastos y balance.</p>`;
const w=Math.max(280,Math.min(720,innerWidth<=760?innerWidth-28-44:innerWidth-240-80-44)),h=250,big=w>=480,m={l:56,r:big?66:14,t:14,b:30},iw=w-m.l-m.r,ih=h-m.t-m.b;
const D=R.map(r=>({date:r.date,day:+r.date.slice(8),i:fInc(r),g:r.exp,b:fBal(r)})),ys=D.flatMap(x=>[x.i,x.g,x.b]),lo=Math.min(0,...ys),hi=Math.max(1,...ys),raw=(hi-lo)/4,pw=10**Math.floor(Math.log10(raw)),st=[1,2,2.5,5,10].map(k=>k*pw).find(s=>s>=raw),y0=Math.floor(lo/st)*st,y1=Math.ceil(hi/st)*st,d0=D[0].day,d1=D[D.length-1].day;
const X=day=>m.l+(day-d0)/(d1-d0)*iw,Y=v=>m.t+ih-(v-y0)/(y1-y0)*ih;finC={D,X,w,h,m};
let g='';for(let v=y0;v<=y1+st/1e6;v+=st)g+=`<line x1="${m.l}" x2="${w-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===0&&y0<0?'#cbd5e1':'#eef0f3'}" stroke-width="1"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#6b7280">${fShort(v)}</text>`;
const k=Math.ceil(D.length/6);let xl=D.map((x,j)=>j%k==0||j==D.length-1?`<text x="${X(x.day)}" y="${h-8}" text-anchor="middle" font-size="11" fill="#6b7280">${x.day}</text>`:'').join('');
const lines=FSER.map(([key,n,c])=>`<path d="${D.map((x,j)=>(j?'L':'M')+X(x.day).toFixed(1)+' '+Y(x[key]).toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`+D.map(x=>`<circle cx="${X(x.day).toFixed(1)}" cy="${Y(x[key]).toFixed(1)}" r="4" fill="${c}" stroke="#fff" stroke-width="2"/>`).join('')).join('');
let used=[],lab='';if(big)FSER.map(([key,n,c])=>({n,y:Y(D[D.length-1][key])})).sort((a,b)=>a.y-b.y).forEach(o=>{if(used.every(u=>Math.abs(u-o.y)>=14)){used.push(o.y);lab+=`<text x="${w-m.r+8}" y="${o.y+4}" font-size="11" fill="#52514e">${o.n}</text>`}});
return`<div class="flg">${FSER.map(([k_,n,c])=>`<span><i class="fln" style="background:${c}"></i>${n}</span>`).join('')}</div><div class="fch" id="fch"><svg id="fsv" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Gráfico de líneas con ingresos, gastos y balance por día del mes en curso">${g}${xl}${lines}${lab}<line id="fcl" y1="${m.t}" y2="${m.t+ih}" stroke="#9ca3af" stroke-width="1" visibility="hidden"/><rect x="${m.l-8}" y="0" width="${iw+16}" height="${h}" fill="transparent" style="touch-action:pan-y" onpointermove="finHov(event)" onpointerdown="finHov(event)" onpointerleave="finOut()"/></svg><div id="fct" class="fct" hidden></div></div><div class="hint" style="margin-top:0">Día del mes · toca o pasa el cursor sobre el gráfico para ver los valores.</div>`}
function finHov(e){const sv=$('#fsv');if(!sv||!finC)return;const r=sv.getBoundingClientRect(),sc=finC.w/r.width,x=(e.clientX-r.left)*sc;let b=0;finC.D.forEach((d,j)=>{if(Math.abs(finC.X(d.day)-x)<Math.abs(finC.X(finC.D[b].day)-x))b=j});
const d=finC.D[b],px=finC.X(d.day),l=$('#fcl'),t=$('#fct');l.setAttribute('x1',px);l.setAttribute('x2',px);l.setAttribute('visibility','visible');
t.innerHTML=`<b>${E(fCap(fDay(d.date)))}</b>${FSER.map(([k,n,c])=>`<div><i class="fdt" style="background:${c}"></i>${n}<span>${fSgn(d[k])}</span></div>`).join('')}`;t.hidden=false;
const tw=t.offsetWidth,lx=px/sc;t.style.left=Math.max(4,Math.min(r.width-tw-4,lx>r.width/2?lx-tw-12:lx+12))+'px'}

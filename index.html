${DEMO?`<div class="demo"><b>Demostración</b><label for="vas">Probar la app como</label><select id="vas" onchange="S.me=+this.value;render();bizM()">${S.users.map(u=>`<option value="${u.id}" ${u.id==m.id?'selected':''} ${blocked(u)?'disabled':''}>${E(u.n)} · ${ROL[u.role]}${blocked(u)?' (bloqueado)':''}</option>`).join('')}</select><label class="ck" style="border:0;padding:8px 0 0"><input type="checkbox" id="sp" ${prem()?'checked':''} onchange="setPlan(this.checked)"> Simular Premium activo</label><label class="ck" style="border:0;padding:4px 0 0"><input type="checkbox" id="sm" ${m.multi?'checked':''} onchange="me().multi=this.checked;save();if(this.checked){bizOk=false;bizPick()}else bizM()"> Simular que mi número está en 2 negocios</label><button class="lnkb" style="margin-top:8px" onclick="DEMO=false;render();bizM()">Ver la app como en producción</button><div class="hint">Oculta estas herramientas. Para recuperarlas, recarga la página.</div></div>`:''}
<div style="display:flex;gap:14px;align-items:center;margin-top:14px"><span class="av big">${S.biz.img?`<img src="${S.biz.img}">`:ic('user',28)}</span>${adm?`<label class="btn" style="margin:0;cursor:pointer;color:var(--tx);font-size:14px">Cambiar foto<input type="file" accept="image/*" hidden onchange="img(this.files[0],128,128,d=>{S.biz.img=d;render();bizM()})"></label>`:`<span class="hint" style="margin:0">Entraste como ${ROL[m.role].toLowerCase()}. Puedes crear y editar, pero no borrar ni administrar el negocio.</span>`}</div>
<label for="bn">Nombre de tu negocio</label><input id="bn" value="${E(S.biz.n)}" ${adm?'':'disabled'} oninput="S.biz.n=this.value;meR();save()" placeholder="Ej: Almacén Doña Rosa">
<label for="bw">WhatsApp oficial del negocio</label><input id="bw" inputmode="tel" value="${E(S.biz.wa)}" ${adm?'':'disabled'} onchange="setWa(this)" placeholder="9 1234 5678"><div class="hint">El número que ven tus clientes en campañas y códigos QR. Puede ser distinto al celular con que entras.</div><div id="bwe" class="ne" style="min-height:0"></div>
<label for="bp">Número principal del negocio</label><div class="grow"><input id="bp" value="${E(o.p)||'Sin registrar'}" disabled>${isO?(o.p?`<button class="btn" onclick="trasM()">Traspasar</button>`:`<button class="btn p" onclick="regM()">Registrar</button>`):''}</div><div class="hint">Celular personal de ${isO?'quien decide':E(o.n)+', propietario del negocio'}. Con este número se recupera la cuenta.</div>
${isO?`<label for="br">Correo de recuperación (opcional)</label><input id="br" type="email" value="${E(S.biz.rec)}" oninput="S.biz.rec=this.value.trim();save()" placeholder="Por si pierdes tu número">`:''}
<div class="hd" style="margin:22px 0 8px;align-items:center"><b>Equipo (${S.users.length}${prem()?'':' de '+LIM+' en plan Básico'})</b>${adm?`<button class="btn" onclick="userM()">${ic('plus',14)} Nuevo usuario</button>`:''}</div>
${!prem()&&S.users.length>LIM?`<div class="badge" style="text-align:left">El plan Básico incluye ${LIM} usuarios. Los demás quedan bloqueados, sin borrarse, hasta que contrates Premium. ${isO?`<button class="lnkb" onclick="pickM()">Cambiar usuarios activos</button>`:''}</div>`:''}
${S.users.map(u=>`<div class="grow tm">${avt(u)}<span style="flex:1;min-width:120px"><b>${E(u.n)}</b>${u.c?`<span class="cg">${E(u.c)}</span>`:''}<br><small style="color:${u.p?'var(--mu)':'#dc2626'}">${E(u.p)||(u.role=='owner'?'Celular sin registrar':'Sin celular: no puede entrar')}</small></span>${u.id==m.id?'<span class="tag">En sesión</span>':''}${blocked(u)?'<span class="tag" style="background:#fee2e2;color:#b91c1c">Bloqueado</span>':''}<span class="tag ${u.role}">${ROL[u.role]}</span>${canU(u)||u.id==m.id?`<button class="x" title="Editar" onclick="userM(${u.id})">${ic('edit',16)}</button>`:''}${canU(u)&&u.role!='owner'&&u.id!=m.id?`<button class="x" title="Eliminar" onclick="delU(${u.id})">${ic('trash',16)}</button>`:''}</div>`).join('')}
<div class="plan-i">Suscripción: <b>${prem()?'Premium':'Plan Básico'}</b>. ${prem()?(isO?`<button class="lnkb" onclick="cancelS(this)">Finalizar suscripción</button>`:'Solo el propietario puede finalizarla.'):`Incluye ${LIM} usuarios. ${adm?`<button class="lnkb" onclick="premM()">Ver Premium</button>`:''}`}</div><button class="btn p" style="width:100%;margin-top:16px" onclick="modal()">Listo</button>${m.multi?`<button class="btn" style="width:100%;margin-top:8px" onclick="bizOk=false;bizPick()">Cambiar de negocio</button>`:''}${isO?`<div style="border-top:1px solid var(--bd);margin-top:22px;padding-top:14px;text-align:center"><button class="lnkb" style="color:#dc2626" onclick="delBizM()">Eliminar negocio y cuenta</button></div>`:''}`,'540px')}
function userM(id){const u=S.users.find(x=>x.id==id)||{role:'collab'},nw=!id,m=me(),self=u.id==m.id;
if(nw){if(!can('a'))return;if(!prem()&&S.users.length>=LIM)return premM('El plan Básico incluye '+LIM+' usuarios. Con Premium sumas a todo tu equipo.');if(!owner().p)return regM('Para sumar a alguien a tu equipo, primero guarda tu cuenta con tu celular.')}else if(!canU(u)&&!self)return;
const eP=u.role!='owner'&&(nw||canU(u)),eR=u.role!='owner'&&m.role=='owner'&&!self;uImg=u.img||'';
modal(`<h3 style="margin:0">${nw?'Nuevo':'Editar'} usuario</h3><div style="display:flex;gap:14px;align-items:center;margin-top:14px"><span class="av big" id="up">${uImg?`<img src="${uImg}">`:ic('user',28)}</span><label class="btn" style="margin:0;cursor:pointer;color:var(--tx);font-size:14px">Foto de perfil<input type="file" accept="image/*" hidden onchange="img(this.files[0],128,128,d=>{uImg=d;$('#up').innerHTML='<img src='+d+'>'})"></label></div>
<label for="a">Nombre *</label><input id="a" value="${E(u.n||'')}">
<label for="c">Celular *</label><input id="c" inputmode="tel" value="${E(u.p||'')}" ${eP?'':'disabled'} placeholder="9 1234 5678"><div class="hint">${u.role=='owner'?'Es el número principal del negocio. Se registra o traspasa desde Mi Negocio.':eP?'Con este número entra a la app por su cuenta, sin contraseña.':'Solo el propietario o un administrador puede cambiarlo.'}</div>
<label for="rl">Rol</label>${eR?`<select id="rl"><option value="collab" ${u.role=='collab'?'selected':''}>Colaborador</option><option value="admin" ${u.role=='admin'?'selected':''}>Administrador</option></select><div class="hint"><b>Colaborador:</b> crea y edita, pero no borra ni administra. <b>Administrador:</b> acceso completo, contrata Premium y gestiona colaboradores.</div>`:`<input id="rl0" value="${ROL[u.role]}" disabled><div class="hint">${u.role=='owner'?'Es único. Solo cambia si traspasas el negocio.':'Solo el propietario puede nombrar administradores.'}</div>`}
<label for="b">Cargo (opcional)</label><input id="b" value="${E(u.c||'')}" placeholder="Ej: Vendedor, Bodeguero"><label for="d">Correo (opcional)</label><input id="d" value="${E(u.e||'')}"><div id="er" class="ne"></div><div class="row" style="margin-top:6px"><button class="btn" onclick="bizM()">Cancelar</button><button class="btn p" onclick="saveU(${id||0})">Guardar</button></div>`)}
function saveU(id){const u=S.users.find(x=>x.id==id),nw=!id,n=$('#a').value.trim(),er=t=>{$('#er').textContent=t};
if(nw?!can('a'):!(canU(u)||u.id==S.me))return;if(!n)return er('El nombre es obligatorio.');
const o={n,c:$('#b').value.trim(),e:$('#d').value.trim(),img:uImg},pi=$('#c'),rl=$('#rl');
if(!pi.disabled){const t=tel(pi.value);if(!t)return er('Escribe un celular válido de 9 dígitos, por ejemplo 9 1234 5678.');if(S.users.some(x=>x.p==t&&x.id!=id))return er('Ese celular ya está en tu equipo.');o.p=t}
if(rl&&me().role=='owner')o.role=rl.value;
if(nw){const x={id:Date.now(),role:'collab',p:'',...o};S.users.push(x);render();return invM(x.id)}
Object.assign(u,o);render();bizM()}
function invM(id){const u=S.users.find(x=>x.id==id),t=`¡Hola ${u.n.trim().split(' ')[0]}! Te agregué al equipo de ${(S.biz.n||'').trim()||'mi negocio'} en EmprendeDash. Entra con tu número de celular, sin contraseña: [enlace de la app]`;modal(`<h3 style="margin:0">Invita a ${E(u.n)}</h3><p class="sub" style="margin:6px 0 12px">Ya puede entrar con su celular ${E(u.p)} como ${ROL[u.role].toLowerCase()}. Avísale por WhatsApp.</p><div class="plan-i" style="margin:0">${E(t)}</div>${DEMO?'<div class="hint">Demostración: el enlace real se agrega cuando la app esté publicada.</div>':''}<div class="row" style="margin-top:16px"><button class="btn" onclick="bizM()">Ahora no</button><a class="btn g" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${waNum(u.p)}?text=${encodeURIComponent(t)}" onclick="setTimeout(bizM,60)">${ic('wa',16)} Invitar por WhatsApp</a></div>`)}
function delU(id){const u=S.users.find(x=>x.id==id);if(!u||!canU(u)||u.role=='owner'||u.id==S.me)return;S.users=S.users.filter(x=>x.id!=id);S.tasks.forEach(t=>t.us=(t.us||[]).filter(x=>x!=id));render();bizM()}
function trasM(){if(!can('owner'))return;const l=S.users.filter(u=>u.role!='owner'&&u.p&&!blocked(u));modal(`<h3 style="margin:0">Traspasar el negocio</h3><p class="sub" style="margin:6px 0 12px">El nuevo propietario decide sobre el negocio y su número pasa a ser el principal. Tú quedas como administrador.</p>${l.length?`<label for="tn">Nuevo propietario</label><select id="tn">${l.map(u=>`<option value="${u.id}">${E(u.n)} · ${E(u.p)}</option>`).join('')}</select>${DEMO?'<div class="hint">Demostración: en la app real se confirma con un código a tu número y otro al número nuevo.</div>':''}<div class="row" style="margin-top:16px"><button class="btn" onclick="bizM()">Cancelar</button><button class="btn p" onclick="trasGo(this)">Traspasar</button></div>`:`<div class="plan-i" style="margin:0">Primero agrega a esa persona a tu equipo con su celular.</div><button class="btn" style="width:100%;margin-top:16px" onclick="bizM()">Volver</button>`}`)}
function trasGo(b){if(!can('owner'))return;if(!b.dataset.c){b.dataset.c=1;b.textContent='¿Seguro? Confirmar traspaso';return}const n=S.users.find(u=>u.id==$('#tn').value);owner().role='admin';n.role='owner';render();bizM()}
function pickM(){if(!can('owner'))return;const k=LIM-1,o=owner(),a=S.act||[];modal(`<h3 style="margin:0">Elige tu equipo activo</h3><p class="sub" style="margin:6px 0 12px">Tu plan Premium terminó. El plan Básico incluye ${LIM} usuarios: tú y ${k} más. Los demás quedan bloqueados, sin borrarse, y vuelven si contratas Premium.</p><div class="grow tm">${avt(o)}<span style="flex:1;min-width:120px"><b>${E(o.n)}</b><br><small style="color:var(--mu)">Propietario</small></span><span class="tag owner">Siempre activo</span></div>${S.users.filter(u=>u.role!='owner').map(u=>`<label class="grow tm pkr"><input type="checkbox" class="pk" id="pk${u.id}" value="${u.id}" ${a.includes(u.id)?'checked':''} onchange="pickC(this)">${avt(u)}<span style="flex:1;min-width:120px"><b>${E(u.n)}</b><br><small style="color:var(--mu)">${ROL[u.role]}${u.p?' · '+E(u.p):''}</small></span></label>`).join('')}<div id="er" class="ne"></div><div class="row" style="margin-top:6px"><button class="btn" onclick="premM()">Volver a Premium</button><button class="btn p" onclick="pickOk()">Confirmar</button></div>`,'480px')}
function pickC(i){const c=[...document.querySelectorAll('.pk:checked')].filter(x=>x!=i);if(i.checked)c.slice(0,c.length+1-(LIM-1)).forEach(x=>x.checked=false)}
function pickOk(){const c=[...document.querySelectorAll('.pk:checked')].map(x=>+x.value),k=LIM-1;if(c.length!=k)return $('#er').textContent='Elige a '+k+(k==1?' persona':' personas')+' para seguir.';S.act=c;render();bizM()}
function bizPick(){const m=me();modal(`<h3 style="margin:0">¿A qué negocio quieres entrar?</h3><p class="sub" style="margin:6px 0 14px">Tu número${m.p?' '+E(m.p):''} está en más de un negocio.</p><button class="bz" onclick="bizOk=true;modal();render()"><span class="av">${S.biz.img?`<img src="${S.biz.img}">`:ic('user',18)}</span><span><b>${E((S.biz.n||'').trim()||'Mi Negocio')}</b><small>${ROL[m.role]}</small></span></button><button class="bz" onclick="$('#bzn').hidden=false"><span class="av">${ic('user',18)}</span><span><b>Emporio Don Luis</b><small>Colaborador · negocio de ejemplo</small></span></button><div id="bzn" class="hint" hidden>Demostración: aquí se abriría el otro negocio con sus propios datos.</div>`,'420px')}
function delBizM(){if(!can('owner'))return;modal(`<h3 style="margin:0;color:#dc2626">Eliminar negocio y cuenta</h3><p class="sub" style="margin:8px 0 12px"><b style="color:var(--tx)">Esto es irreversible.</b> Se borran para siempre tus clientes, grupos, tareas, precios, publicaciones y códigos QR, y todo tu equipo pierde el acceso.${prem()?' Tu suscripción Premium también termina.':''}</p><label class="ck" style="border:0;padding:0"><input type="checkbox" id="dk" onchange="$('#db').disabled=!this.checked"> Entiendo que no se puede deshacer</label><div class="row" style="margin-top:16px"><button class="btn" onclick="bizM()">Cancelar</button><button class="btn" id="db" disabled style="background:#dc2626;color:#fff;border-color:#dc2626" onclick="delBiz()">Eliminar para siempre</button></div>`)}
function delBiz(){if(!can('owner')||!$('#dk').checked)return;S=JSON.parse(SEED);norm1();norm2();cur='inicio';draft=null;W=null;bizOk=false;modal();render();modal(`<h3 style="margin:0">Negocio eliminado</h3><p class="sub" style="margin:8px 0 16px">Tu negocio y tu cuenta se borraron. La app quedó como nueva.</p><button class="btn p" style="width:100%" onclick="modal()">Entendido</button>`,'380px')}
render();if(editP!==null)calc();
</script>
</body></html>
